openapi: 3.1.0
info:
  title: Ромашка
  description: Автоматизация сети ресторанов «Ромашка»
  version: 0.1.0
paths:
  /api/reports/{response_format}/{entity_type}/{entity_id}:
    get:
      tags:
      - Отчёты
      summary: Отчёт по сущности в указанном формате
      description: |-
        Формирует отчёт по сущности указанного типа и кода в указанном формате.

        :param response_format: Формат отчёта.
        :param entity_type: Тип сущности.
        :param entity_id: Код сущности.
        :param storage: Хранилище, в котором ищется сущность.
        :param factory: Фабрика, создающая отчёт нужного формата.
        :return: Содержимое отчёта: Markdown и CSV — файлом, остальные форматы — текстом.
        :raises HTTPException: 404, если сущности нет.
      operationId: get_entity_report_api_reports__response_format___entity_type___entity_id__get
      parameters:
      - name: response_format
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResponseFormat'
          description: Формат отчёта
        description: Формат отчёта
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Код (идентификатор) сущности
          title: Entity Id
        description: Код (идентификатор) сущности
      responses:
        '200':
          description: 'Отчёт: Markdown и CSV — файлом на скачивание, остальные форматы — текстом'
        '404':
          description: Сущность не найдена
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/reports/{entity_type}/{entity_id}:
    get:
      tags:
      - Отчёты
      summary: Отчёт по сущности в формате из настроек
      description: |-
        Формирует отчёт по сущности указанного типа и кода в формате из настроек (``create_default``).

        :param entity_type: Тип сущности.
        :param entity_id: Код сущности.
        :param storage: Хранилище, в котором ищется сущность.
        :param factory: Фабрика, создающая отчёт в формате из настроек.
        :return: Содержимое отчёта: Markdown и CSV — файлом, остальные форматы — текстом.
        :raises HTTPException: 404, если сущности нет.
      operationId: get_entity_default_report_api_reports__entity_type___entity_id__get
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Код (идентификатор) сущности
          title: Entity Id
        description: Код (идентификатор) сущности
      responses:
        '200':
          description: 'Отчёт: Markdown и CSV — файлом на скачивание, остальные форматы — текстом'
        '404':
          description: Сущность не найдена
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get_report:
    get:
      tags:
      - Отчёты
      summary: Отчёт по технологической карте по наименованию
      description: |-
        Формирует отчёт по технологической карте в указанном формате.

        :param recipe_name: Наименование карты, регистр и пробелы по краям не учитываются.
        :param storage: Хранилище, в котором ищется карта.
        :param factory: Фабрика, создающая отчёт нужного формата.
        :param response_format: Формат отчёта, None — формат из настроек.
        :return: Содержимое отчёта: Markdown и CSV — файлом, остальные форматы — текстом.
        :raises HTTPException: 404, если карты с таким наименованием нет.
      operationId: get_report_api_get_report_get
      parameters:
      - name: recipe_name
        in: query
        required: true
        schema:
          type: string
          description: Наименование карты, регистр не учитывается
          title: Recipe Name
        description: Наименование карты, регистр не учитывается
      - name: response_format
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ResponseFormat'
          - type: 'null'
          description: Формат отчёта, по умолчанию из настроек
          title: Response Format
        description: Формат отчёта, по умолчанию из настроек
      responses:
        '200':
          description: Successful Response
        '404':
          description: Карта не найдена
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/get_report_formats:
    get:
      tags:
      - Отчёты
      summary: Форматы отчётов
      description: |-
        Возвращает все форматы, в которых можно построить отчёт.

        Список берётся из перечисления ``ResponseFormat``: новый формат появляется здесь без правки маршрута.

        :return: Значения форматов в порядке объявления, например ``["txt", "markdown", ...]``.
      operationId: get_report_formats_api_get_report_formats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ResponseFormat'
                type: array
                title: Response Get Report Formats Api Get Report Formats Get
  /api/entities/{entity_type}:
    get:
      tags:
      - Сущности
      summary: Список сущностей типа
      description: |-
        Возвращает все сущности указанного типа.

        :param entity_type: Тип сущности.
        :param storage: Хранилище сущностей.
        :return: Сущности в формате выгрузки, в порядке добавления.
      operationId: get_entities_api_entities__entity_type__get
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Get Entities Api Entities  Entity Type  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Сущности
      summary: Создать сущность
      description: |-
        Создаёт сущность указанного типа.

        Если в данных есть ``id``, он становится кодом сущности, иначе код создаётся автоматически.

        :param entity_type: Тип сущности.
        :param data: Поля сущности.
        :param service: Сервис доменных сущностей.
        :return: Созданная сущность в формате выгрузки.
      operationId: create_entity_api_entities__entity_type__post
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 'Поля сущности в формате выгрузки. Вложенные сущности хранилища задаются ссылкой ``{"id": "<код>"}``,
                ``model_type`` у самой сущности можно не указывать.'
              title: Data
            examples:
              warehouse:
                summary: Склад или группа номенклатуры
                value:
                  name: Склад №3
              range:
                summary: Единица измерения
                description: Производная единица ссылается на базовую по коду; у базовой ``base`` равен null.
                value:
                  name: центнер
                  factor: 100000
                  base:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              nomenclature:
                summary: Номенклатура
                description: Группа и единица измерения задаются ссылками на сущности хранилища.
                value:
                  name: Пастернак
                  full_name: Пастернак корневой
                  group:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  range:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  type: сырьё
                  grams_per_base_unit: 1
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Entity Api Entities  Entity Type  Post
        '400':
          description: Некорректные данные, ссылка на неизвестную сущность, занятые код или наименование
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/entities/{entity_type}/{entity_id}:
    get:
      tags:
      - Сущности
      summary: Сущность по коду
      description: |-
        Возвращает сущность указанного типа по коду.

        :param entity_type: Тип сущности.
        :param entity_id: Код сущности.
        :param storage: Хранилище сущностей.
        :return: Сущность в формате выгрузки.
        :raises HTTPException: 404, если сущности нет.
      operationId: get_entity_api_entities__entity_type___entity_id__get
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Код (идентификатор) сущности
          title: Entity Id
        description: Код (идентификатор) сущности
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Entity Api Entities  Entity Type   Entity Id  Get
        '404':
          description: Сущность не найдена
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Сущности
      summary: Заменить все поля сущности
      description: |-
        Полностью заменяет поля сущности: поля, которых нет в данных, не сохраняются.

        Без ``id`` в данных код не меняется. Другой ``id`` меняет код, но только у сущности,
        на которую никто не ссылается.

        :param entity_type: Тип сущности.
        :param entity_id: Текущий код сущности.
        :param data: Все поля сущности.
        :param storage: Хранилище, в котором проверяется, что сущность есть.
        :param service: Сервис доменных сущностей.
        :return: Изменённая сущность в формате выгрузки.
        :raises HTTPException: 404, если сущности нет.
      operationId: put_entity_api_entities__entity_type___entity_id__put
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Код (идентификатор) сущности
          title: Entity Id
        description: Код (идентификатор) сущности
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 'Поля сущности в формате выгрузки. Вложенные сущности хранилища задаются ссылкой ``{"id": "<код>"}``,
                ``model_type`` у самой сущности можно не указывать.'
              title: Data
            examples:
              warehouse:
                summary: Склад или группа номенклатуры
                value:
                  name: Склад №3
              range:
                summary: Единица измерения
                description: Производная единица ссылается на базовую по коду; у базовой ``base`` равен null.
                value:
                  name: центнер
                  factor: 100000
                  base:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              nomenclature:
                summary: Номенклатура
                description: Группа и единица измерения задаются ссылками на сущности хранилища.
                value:
                  name: Пастернак
                  full_name: Пастернак корневой
                  group:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  range:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  type: сырьё
                  grams_per_base_unit: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Put Entity Api Entities  Entity Type   Entity Id  Put
        '400':
          description: Некорректные данные, ссылка на неизвестную сущность, занятые код или наименование
        '404':
          description: Сущность не найдена
        '409':
          description: 'На сущность ссылаются другие сущности: удалять её и менять код нельзя'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Сущности
      summary: Изменить часть полей сущности
      description: |-
        Изменяет только указанные поля сущности, остальные сохраняются.

        Значение поля заменяется целиком, в том числе вложенный объект. Код меняется по тем же правилам, что у PUT.

        :param entity_type: Тип сущности.
        :param entity_id: Текущий код сущности.
        :param data: Изменяемые поля сущности.
        :param storage: Хранилище, в котором проверяется, что сущность есть.
        :param service: Сервис доменных сущностей.
        :return: Изменённая сущность в формате выгрузки.
        :raises HTTPException: 404, если сущности нет.
      operationId: patch_entity_api_entities__entity_type___entity_id__patch
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Код (идентификатор) сущности
          title: Entity Id
        description: Код (идентификатор) сущности
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 'Поля сущности в формате выгрузки. Вложенные сущности хранилища задаются ссылкой ``{"id": "<код>"}``,
                ``model_type`` у самой сущности можно не указывать.'
              title: Data
            examples:
              warehouse:
                summary: Склад или группа номенклатуры
                value:
                  name: Склад №3
              range:
                summary: Единица измерения
                description: Производная единица ссылается на базовую по коду; у базовой ``base`` равен null.
                value:
                  name: центнер
                  factor: 100000
                  base:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              nomenclature:
                summary: Номенклатура
                description: Группа и единица измерения задаются ссылками на сущности хранилища.
                value:
                  name: Пастернак
                  full_name: Пастернак корневой
                  group:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  range:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  type: сырьё
                  grams_per_base_unit: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Patch Entity Api Entities  Entity Type   Entity Id  Patch
        '400':
          description: Некорректные данные, ссылка на неизвестную сущность, занятые код или наименование
        '404':
          description: Сущность не найдена
        '409':
          description: 'На сущность ссылаются другие сущности: удалять её и менять код нельзя'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Сущности
      summary: Удалить сущность
      description: |-
        Удаляет сущность, если на неё никто не ссылается.

        :param entity_type: Тип сущности.
        :param entity_id: Код сущности.
        :param storage: Хранилище, в котором проверяется, что сущность есть.
        :param service: Сервис доменных сущностей.
        :raises HTTPException: 404, если сущности нет.
      operationId: delete_entity_api_entities__entity_type___entity_id__delete
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Код (идентификатор) сущности
          title: Entity Id
        description: Код (идентификатор) сущности
      responses:
        '204':
          description: Successful Response
        '404':
          description: Сущность не найдена
        '409':
          description: 'На сущность ссылаются другие сущности: удалять её и менять код нельзя'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/filter/{entity_type}:
    post:
      tags:
      - Фильтрация
      summary: Отбор сущностей типа по условиям
      description: |-
        Возвращает сущности указанного типа, которые прошли все условия фильтра.

        Тело запроса десериализуется в ``FilterDto`` через единый механизм ``DeserializerFactory``,
        отбор выполняет ``Prototype``, а результат выгружается через ``ConverterFactory``.

        :param entity_type: Тип сущности.
        :param data: Условия фильтра в формате ``FilterDto``.
        :param storage: Хранилище сущностей.
        :return: Отобранные сущности в формате выгрузки, в порядке добавления.
      operationId: filter_entities_api_filter__entity_type__post
      parameters:
      - name: entity_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/EntityType'
          description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
        description: 'Тип сущности: номенклатура, группа номенклатуры, единица измерения, склад или рецепт'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 'Условия ``filters``: путь к полю через точку (``field_name``), способ сравнения ``EQUALS`` или
                ``LIKE`` (``filter_type``) и значение (``value``). Модель проходит фильтр, если выполнены все условия; условие
                выполнено, если совпало хотя бы одно значение по пути. Пустой список пропускает всё.'
              title: Data
            examples:
              name_like:
                summary: Вхождение строки в наименование
                value:
                  filters:
                  - field_name: name
                    filter_type: LIKE
                    value: Говядина
              nested_equals:
                summary: Полное совпадение во вложенной модели
                description: 'Путь через точку: номенклатура, у которой базовая единица — грамм.'
                value:
                  filters:
                  - field_name: range.base.name
                    filter_type: EQUALS
                    value: грамм
              collection:
                summary: Поиск в коллекции
                description: 'Для рецептов: карты, в составе которых есть картофель.'
                value:
                  filters:
                  - field_name: items.nomenclature.name
                    filter_type: EQUALS
                    value: Картофель
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Filter Entities Api Filter  Entity Type  Post
        '400':
          description: Некорректное тело запроса, неизвестный способ сравнения или недоступное поле в пути
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/turnover:
    post:
      tags:
      - Отчёты
      - Фильтрация
      summary: Оборотно-сальдовая ведомость с фильтром
      description: |-
        Строит ОСВ: строка на пару «номенклатура + склад», количества в базовой единице номенклатуры.

        Тело запроса десериализуется в ``TurnoverRequestDto`` через ``DeserializerFactory``.
        Записи журнала отбирает ``Prototype`` по условиям запроса. Записи до начала периода дают остаток
        на начало, записи периода — приход и расход, записи после конца не учитываются.
        Сформированный отчёт сериализуется в словарь через ``ConverterFactory``.

        :param data: Период и условия отбора в формате ``TurnoverRequestDto``.
        :param service: Сервис ОСВ.
        :return: Период и строки ОСВ: начало, приход, расход, конец.
      operationId: get_turnover_api_turnover_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Data
              description: 'Период ``start`` и ``end`` в формате ``ГГГГ-ММ-ДД``, обе границы включительно и необязательны:
                без ``start`` — с первой отобранной записи, без ``end`` — по сегодняшний день. ``filters`` — условия отбора
                записей журнала в том же формате, что у фильтра сущностей (например, ``nomenclature.name`` или ``warehouse.name``).'
            examples:
              october:
                summary: ОСВ за октябрь по всем записям
                value:
                  start: '2026-10-01'
                  end: '2026-10-31'
                  filters: []
              warehouse:
                summary: ОСВ за октябрь по одному складу
                value:
                  start: '2026-10-01'
                  end: '2026-10-31'
                  filters:
                  - field_name: warehouse.name
                    filter_type: EQUALS
                    value: Склад ресторана
              no_period:
                summary: ОСВ с первой записи по сегодняшний день
                value:
                  filters:
                  - field_name: nomenclature.name
                    filter_type: EQUALS
                    value: Говядина
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Turnover Api Turnover Post
        '400':
          description: Некорректное тело запроса, неизвестный способ сравнения или недоступное поле в пути
        '500':
          description: 'Единицу номенклатуры сменили после проведения записей: количества не сложить'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/logs:
    post:
      tags:
      - Логирование
      summary: Журнал логов в JSON с фильтрацией и сортировкой
      description: |-
        Возвращает записи журнала логов в формате JSON с фильтрацией и сортировкой.

        Отбор записей выполняет ``Prototype``, сортировку — универсальный ``Sorter``,
        а сериализацию — ``ConverterFactory``.

        :param service: Сервис работы с логами.
        :param data: Условия фильтрации и сортировки в формате ``LogQueryDto``.
        :return: Список записей лога в формате JSON.
      operationId: get_logs_api_logs_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                type: object
                description: Условия фильтрации ``filters`` в формате ``FilterDto`` и необязательная сортировка ``sort`` с
                  полями ``field_name`` и ``direction`` со значением ``ASC`` или ``DESC``.
              - type: 'null'
              title: Data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Get Logs Api Logs Post
        '400':
          description: Некорректное тело запроса, неизвестный способ сравнения или недоступное поле в пути
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/logs/{export_format}:
    post:
      tags:
      - Логирование
      summary: Выгрузка логов в TXT, CSV или Markdown
      description: |-
        Возвращает журнал логов в указанном табличном формате с фильтрацией и сортировкой.

        TXT и CSV отдаются файлом на скачивание, Markdown — текстом в браузере.

        :param export_format: Формат выгрузки.
        :param service: Сервис работы с логами.
        :param data: Необязательные условия фильтрации и сортировки.
        :return: HTTP-ответ с таблицей логов.
      operationId: export_logs_api_logs__export_format__post
      parameters:
      - name: export_format
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TableExportFormat'
          description: 'Формат выгрузки лога: txt, csv или markdown'
        description: 'Формат выгрузки лога: txt, csv или markdown'
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
                description: Условия фильтрации ``filters`` в формате ``FilterDto`` и необязательная сортировка ``sort`` с
                  полями ``field_name`` и ``direction`` со значением ``ASC`` или ``DESC``.
              - type: 'null'
              title: Data
      responses:
        '200':
          description: 'Лог: TXT и CSV отдаются файлом на скачивание, Markdown — текстом в браузере'
        '400':
          description: Некорректные условия фильтрации или сортировки
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/settings:
    patch:
      tags:
      - Настройки
      summary: Изменить параметры настроек
      description: |-
        Обновляет указанные параметры загруженных настроек и публикует событие через ``Observer``.

        :param data: Словарь изменяемых полей настроек.
        :param settings_manager: Менеджер настроек.
        :return: Актуальная модель настроек в формате выгрузки.
      operationId: patch_settings_api_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Data
              description: Изменяемые поля настроек приложения; остальные поля сохраняются.
            examples:
              format:
                summary: Сменить формат отчётов по умолчанию
                value:
                  response_format: markdown
              boss:
                summary: Сменить руководителя и наименование организации
                value:
                  boss_name: Сидоров Пётр Иванович
                  organization:
                    name: Ромашка Плюс
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Patch Settings Api Settings Patch
        '400':
          description: Некорректные параметры настроек
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    EntityType:
      type: string
      enum:
      - nomenclature
      - nomenclature_group
      - range
      - warehouse
      - recipe
      title: EntityType
      description: |-
        Тип сущности, которую можно найти в хранилище по коду.

        Значения — строки: в таком виде тип задаётся в параметре запроса API.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ResponseFormat:
      type: string
      enum:
      - txt
      - markdown
      - csv
      - xml
      - html
      title: ResponseFormat
      description: |-
        Формат, в котором формируется отчёт.

        Значения — строки: в таком виде формат задаётся в параметре запроса API и в файле настроек.
    TableExportFormat:
      type: string
      enum:
      - txt
      - csv
      - markdown
      title: TableExportFormat
      description: 'Форматы табличной выгрузки данных: логов, ведомостей и журналов.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: Отчёты
  description: Отчёты по сущностям в разных форматах
- name: Сущности
  description: Создание, чтение, изменение и удаление доменных сущностей
- name: Фильтрация
  description: Отбор сущностей и записей журнала по условиям (шаблон «Прототип»)
- name: Логирование
  description: Просмотр, фильтрация, сортировка и выгрузка журнала логов
- name: Настройки
  description: Обновление параметров настроек приложения
